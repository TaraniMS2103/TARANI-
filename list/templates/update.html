<!DOCTYPE html>
<html>
<head>
    <title>Update Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>✏️ Update Task</h1>
        <form method="POST" class="form-container">
            <input type="text" name="task" value="{{ task }}" required>
            <button type="submit" class="btn edit-btn">Update Task</button>
        </form>
        <br>
        <a href="/" class="btn toggle-btn">← Back to List</a>
    </div>
</body>

</html>
