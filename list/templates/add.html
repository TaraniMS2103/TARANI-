<!DOCTYPE html>
<html>
<head>
    <title>Add Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>➕ Add New Task</h1>
        <form method="POST" class="form-container">
            <input type="text" name="task" placeholder="Task Name" required>

            <select name="priority" required>
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
            </select>

            <input type="date" name="due_date" placeholder="Due Date">

            <input type="text" name="category" placeholder="Category (Work, Personal, etc.)">

            <textarea name="description" placeholder="Description / Notes"></textarea>

            <select name="recurring" required>
                <option value="None" selected>None</option>
                <option value="Daily">Daily</option>
                <option value="Weekly">Weekly</option>
                <option value="Monthly">Monthly</option>
            </select>

            <button type="submit" class="btn add-btn">Add Task</button>
        </form>
        <br>
        <a href="/" class="btn toggle-btn">← Back to List</a>
    </div>
</body>
</html>
